<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 1;
      opacity: 0.25;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 9px; opacity: 0.9; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid Pattern -->
  <g class="grid">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" class="grid-line"/>
    <path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340" class="grid-line"/>
  </g>

  <!-- Dynamic / Graphic Background Wave Elements (Behind Text) -->
  <g opacity="0.35">
    <!-- Hybrid Cloud Nodes Connected -->
    <path d="M 100,280 Q 300,160 500,250 T 900,200 T 1150,120" fill="none" stroke="url(#textGrad)" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 50,100 Q 250,220 600,120 T 1100,260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Nodes -->
    <circle cx="300" cy="195" r="6" fill="#38bdf8" class="pulse-circle"/>
    <circle cx="500" cy="250" r="7" fill="#818cf8" class="pulse-circle"/>
    <circle cx="900" cy="200" r="6" fill="#c084fc" class="pulse-circle"/>
    <circle cx="600" cy="120" r="5" fill="#38bdf8"/>
    <circle cx="1100" cy="260" r="8" fill="#818cf8"/>
  </g>

  <!-- Decorative Pills / Tags in Background Accent Layer -->
  <g opacity="0.25">
    <rect x="820" y="45" width="130" height="32" rx="16" fill="#38bdf8"/>
    <rect x="970" y="45" width="160" height="32" rx="16" fill="#818cf8"/>
    <rect x="850" y="265" width="150" height="32" rx="16" fill="#c084fc"/>
  </g>

  <!-- FOREGROUND CONTENT (Ensured clear visibility and sharp contrast) -->

  <!-- Top Category Chip -->
  <g transform="translate(80, 50)">
    <rect width="260" height="32" rx="16" fill="url(#accentGrad)"/>
    <text x="130" y="21" text-anchor="middle" class="badge-text">⚡ HYBRID CLOUD &amp; EDGE IaaS ⚡</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="135" class="title" filter="url(#glow)">Awesome Hybrid Cloud Infrastructure</text>

  <!-- Subtitle -->
  <text x="80" y="178" class="subtitle">Curated SaaS Platforms, Edge Racks &amp; Enterprise Open-Source Ecosystem</text>

  <!-- Feature Pills (Foreground Layer) -->
  <g transform="translate(80, 220)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" class="badge-text">☁️ Public Cloud Extension</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" class="badge-text">🖥️ On-Premises &amp; Edge</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" class="badge-text">🐧 Open-Source Control</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="23" text-anchor="middle" class="badge-text">🔐 Data Sovereignty</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="80" y="295" font-family="sans-serif" font-size="13" fill="#64748b">Updated October 2026 • Curated for Platform Engineers &amp; Infrastructure Architects</text>
</svg>
